name: Build

on:
  push:
    branches: [main]
    paths:
      - "go/**"
      - "proto/**"
      - "examples/go/**"
      - "scripts/plugin-pack.py"
      - "Makefile"
      - ".github/workflows/ci-go.yml"
  pull_request:
    paths:
      - "go/**"
      - "proto/**"
      - "examples/go/**"
      - "scripts/plugin-pack.py"
      - "Makefile"
      - ".github/workflows/ci-go.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest
      - name: Verify
        run: make check
